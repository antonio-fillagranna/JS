<!DOCTYPE html>
<html>
<body>

<h1>Strings JavaScript</h1>
<h2>O Método indexOf()</h2>

<p>O método indexOf() retorna a posição da primeira ocorrência de uma string dentro de outra string.</p>
<p>A posição da primeira ocorrência de "localize" é:</p>
<p id="demo"></p>

<script>
let texto = "Por favor, localize onde 'localize' ocorre!";
let indice = texto.indexOf("localize");
document.getElementById("demo").innerHTML = indice;
</script>

</body>
</html>
