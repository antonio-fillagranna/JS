<!DOCTYPE html>
<html>
<body>

<h1>Métodos de String JavaScript</h1>
<p>Converter string para letras minúsculas:</p>

<button onclick="minhaFuncao()">Teste</button>

<p id="demo">Olá Mundo!</p>

<script>
function minhaFuncao() {
  let texto = document.getElementById("demo").innerHTML;
  document.getElementById("demo").innerHTML =
  texto.toLowerCase();
}
</script>

</body>
</html>
