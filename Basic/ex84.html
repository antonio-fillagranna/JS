<!DOCTYPE html>
<html>

<body>

<h1>Métodos de String JavaScript</h1>
<p>Substitua "VSCode" por "Intellij" no parágrafo abaixo:</p>

<button onclick="minhaFuncao()">Teste</button>

<p id="demo">A melhor IDE é o VSCode!</p>

<script>
function minhaFuncao() {
  let texto = document.getElementById("demo").innerHTML;
  document.getElementById("demo").innerHTML =
  texto.replace("VSCode","Intellij");
}
</script>

</body>
</html>
