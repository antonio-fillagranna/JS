<!DOCTYPE html>
<html>
<body>

<h1>Métodos de String JavaScript</h1>
<p>Exibir o primeiro elemento do array, após uma divisão de string:</p>

<p id="demo"></p>

<script>
let texto = "a,b,c,d,e,f";
const meuArray = texto.split(",");
document.getElementById("demo").innerHTML = meuArray[0];
</script>

</body>
</html>
