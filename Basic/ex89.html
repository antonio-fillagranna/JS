<!DOCTYPE html>
<html>
<body>

<h2>Números JavaScript</h2>

<p>Números muito grandes ou muito pequenos podem ser escritos com notação científica (exponencial):</p>

<p id="demo"></p>

<script>
let x = 123e5;
let y = 123e-5;
document.getElementById("demo").innerHTML = x + "<br>" + y;
</script>

</body>
</html>
